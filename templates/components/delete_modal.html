<div class="project-delete-trigger">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-{{ item.id }}"
            aria-label="Hapus {{ item }}"
            title="Hapus {{ item }}">
        Hapus {{ item }}
    </button>
</div>
<div id="delete-{{ item.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-title-{{ item.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-{{ item.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-{{ item.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-title-{{ item.id }}">Hapus {{ item }}?</h2>
        <p>
            Apakah Anda yakin ingin menghapus <strong>{{ item }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-{{ item.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url delete_url_name item.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
